[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbc-sim"
version = "0.1.0"
description = "Coherent beam combining simulator with SPGD, LOCSET and near-field phase-sensor feedback"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "cbc-sim contributors" }]
keywords = ["coherent beam combining", "photonics", "laser", "SPGD", "LOCSET", "phased array"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
web = ["streamlit>=1.20"]
test = ["pytest>=7.0"]
dev = ["streamlit>=1.20", "pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["cbc*"]
exclude = ["tests*", "apps*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
